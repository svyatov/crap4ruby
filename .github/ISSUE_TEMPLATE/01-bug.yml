name: Bug report
description: Report incorrect analysis, coverage, or CLI behavior.
body:
  - type: markdown
    attributes:
      value: |
        Include a minimal example that reproduces the problem. Remove credentials and private application data.
        Report security vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Paste the output of `ruby --version` and `crap4ruby --version`. Include your operating system.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Include the working directory and relevant file paths. Replace private names consistently.
      render: sh
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal Ruby source
      description: Include the smallest source example that produces the problem, or reproduction steps for a CLI failure.
      render: ruby
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: State the expected score, output, or exit status and why it is correct.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste the output, error, or incorrect snapshot entry.
      render: text
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Coverage input
      description: For coverage problems, include the matching sanitized .resultset.json entry and the SimpleCov version. Otherwise, leave this empty.
      render: json
