# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: bundle exec rake lint
    - name: secrets
      run: betterleaks git --pre-commit --staged --redact --verbose
    - name: whitespace
      run: git diff --cached --check

pre-push:
  jobs:
    - name: checks
      run: bundle exec rake

commit-msg:
  jobs:
    - name: conventional
      run: |
        head -1 "{1}" | grep -qE '^(feat|fix|docs|refactor|test|ci|chore)(\([^)]+\))?!?: [^[:space:]].*' || { echo "Use Conventional Commits: type(scope): description"; exit 1; }
